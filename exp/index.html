<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stage Lighting Pro - Global Exhibition Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #f8fafc;
            --bg-card: white;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Sidebar Active State - Text Only */
        .sidebar-item {
            padding: 12px 8px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            color: var(--text-muted);
        }
        .sidebar-item:hover {
            background-color: rgba(99, 102, 241, 0.05);
            color: var(--text-main);
        }
        .sidebar-item.active {
            background-color: var(--bg-card);
            color: #4f46e5;
            font-weight: 700;
            border-left-color: #4f46e5;
        }

        /* Top Nav Primary */
        .top-nav-primary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            height: 48px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }
        .top-nav-scroll {
            flex: 1;
            display: flex;
            gap: 24px;
            overflow-x: auto;
            height: 100%;
            align-items: center;
            padding-right: 48px; /* Space for fixed button */
        }
        .top-nav-item {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: pointer;
            height: 100%;
            display: flex;
            align-items: center;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-nav-item.active {
            color: #4f46e5;
            border-bottom-color: #4f46e5;
        }
        .top-nav-all-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 48px;
            background: linear-gradient(to left, var(--bg-card) 80%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* Smooth Scroll */
        html { scroll-behavior: smooth; }

        /* App Layout */
        .app-layout {
            display: flex;
            height: calc(100vh - 112px); /* Header + TopNav height */
            overflow: hidden;
        }
        .sidebar {
            width: 90px;
            flex-shrink: 0;
            background-color: var(--bg-primary);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }
        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--bg-card);
        }

        /* Card Styles */
        .video-aspect { aspect-ratio: 16 / 9; }
        .portrait-video { aspect-ratio: 9 / 16; }
        
        .card-cover {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            background-color: #f1f5f9;
            aspect-ratio: 16 / 9;
        }
        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-btn-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }

        /* TikTok Style Video Player */
        .tiktok-player {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;
            display: none;
        }
        .tiktok-player.active {
            display: flex;
            flex-direction: column;
        }
        .tiktok-slide-container {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        .tiktok-slide {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }
        .tiktok-slide video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* 保持完整显示 */
        }
        .tiktok-sidebar {
            position: absolute;
            right: 16px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        .tiktok-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tiktok-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.1);
        }
        .tiktok-btn.liked {
            background: rgba(239, 68, 68, 0.8);
        }
        .tiktok-info {
            position: absolute;
            left: 16px;
            bottom: 80px;
            right: 80px;
            color: white;
            z-index: 10;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .tiktok-close {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }
        
        /* Navigation Arrows for Player */
        .nav-arrow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            cursor: pointer;
            animation: bounce 2s infinite;
        }
        .nav-arrow.up { top: 80px; }
        .nav-arrow.down { bottom: 40px; }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }

        /* Detail Sheet (Half Modal from Bottom) */
        .detail-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60vh;
            background: white;
            border-radius: 24px 24px 0 0;
            z-index: 110;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .detail-sheet.active {
            transform: translateY(0);
        }
        .dark .detail-sheet {
            background: #1e293b;
        }
        .detail-sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 105;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .detail-sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Dark mode overrides */
        .dark .bg-white { background-color: #1e293b !important; }
        .dark .bg-slate-50 { background-color: #334155 !important; }
        .dark .bg-slate-100 { background-color: #334155 !important; }
        .dark .text-slate-900 { color: #f1f5f9 !important; }
        .dark .text-slate-700 { color: #e2e8f0 !important; }
        .dark .text-slate-600 { color: #cbd5e1 !important; }
        .dark .text-slate-500 { color: #94a3b8 !important; }
        .dark .border-slate-100 { border-color: #334155 !important; }
        .dark .border-slate-200 { border-color: #475569 !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>

</head>

                    { id: 'spotlight', label: 'Stage spotlight' },
                    { id: 'par', label: 'Par lights' },
                    { id: 'wash', label: 'Wash light' },
                    { id: 'rgb', label: 'Light rgb led' },
                    { id: 'follow', label: 'Follow spot light' },
                    { id: 'used', label: 'Used lighting' }
                ]
            },
            {
                id: 'light-show',
                label: 'Light show',
                subItems: [
                    { id: 'all-show', label: 'All Shows' }
                ]
            },
            {
                id: 'exp2',
                label: 'Version 2.0',
                subItems: [
                    { id: 'exp2-demo', label: 'V2 Preview' }
                ]
            }
        ];

        function renderTopNav() {
            const container = document.getElementById('top-nav-container');
            container.innerHTML = navStructure.map(item => `
                <div class="top-nav-item ${item.id === currentNavId ? 'active' : ''}" 
                     onclick="selectCategory('${item.id}')">
                    ${item.label}
                </div>
            `).join('');
        }

        function selectCategory(navId) {
            currentNavId = navId;
            renderTopNav(); // Update active state
            
            // Render Sidebar
            const navItem = navStructure.find(n => n.id === navId);
            const sidebar = document.getElementById('sidebar-nav');
            
            if (navItem && navItem.subItems.length > 0) {
                sidebar.innerHTML = navItem.subItems.map(sub => `
                    <div class="sidebar-item ${sub.id === currentSubId ? 'active' : ''}" 
                         onclick="selectSubCategory('${sub.id}')">
                        ${sub.label}
                    </div>
                `).join('');
                
                // Select first sub-item by default if currentSubId not in list
                const exists = navItem.subItems.find(s => s.id === currentSubId);
                if (!exists) {
                    selectSubCategory(navItem.subItems[0].id);
                } else {
                    selectSubCategory(currentSubId); // Re-render content
                }
            } else {
                sidebar.innerHTML = '<div class="p-4 text-xs text-slate-400 text-center">No categories</div>';
                document.getElementById('main-content').innerHTML = '';
            }
            lucide.createIcons();
        }

        function selectSubCategory(subId) {
            currentSubId = subId;
            
            // Update Sidebar Active State
            document.querySelectorAll('.sidebar-item').forEach(el => {
                el.classList.remove('active');
                if (el.textContent.trim() === navStructure.find(n => n.id === currentNavId).subItems.find(s => s.id === subId).label) {
                    el.classList.add('active');
                }
            });

            renderContent(subId);
        }

        // ============== RENDER CONTENT ==============
        function renderContent(subId) {
            const container = document.getElementById('main-content');
            const data = contentData[subId] || [];
            
            const navItem = navStructure.find(n => n.id === currentNavId);
            const subItem = navItem.subItems.find(s => s.id === subId);

            let headerHtml = `
                <div class="mb-6 animate-fade-in">
                    <h2 class="text-xl font-bold">${subItem.label}</h2>
                    <p class="text-xs text-slate-500">${navItem.label} > ${subItem.label}</p>
                </div>
            `;

            if (data.length === 0) {
                container.innerHTML = headerHtml + `<div class="text-center py-10 text-slate-400">Coming Soon</div>`;
                return;
            }

            const gridHtml = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 animate-fade-in">
                    ${data.map((item, idx) => renderCard(item, subId, idx)).join('')}
                </div>
            `;

            container.innerHTML = headerHtml + gridHtml;
            lucide.createIcons();
        }

        function renderCard(item, categoryId, index) {
            const isFav = favorites.includes(item.id);
            const isVideo = item.type === 'video' || item.video; // Assume all have video
            const isLink = item.type === 'link';
            
            const onclick = isLink ? `window.open('${item.url}', '_blank')` : `openTiktokPlayer('${categoryId}', ${index})`;
            
            return `
                <div class="flex flex-col gap-2 group cursor-pointer" onclick="${onclick}">
                    <div class="card-cover">
                        <img src="${item.thumb}" loading="lazy">
                        <div class="play-btn-overlay">
                            <i data-lucide="${isLink ? 'external-link' : 'play'}" class="w-4 h-4 fill-white"></i>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-start px-1">
                        <div>
                            <h3 class="font-bold text-sm line-clamp-2 leading-tight">${item.name || item.title}</h3>
                            <p class="text-xs text-slate-500 mt-0.5">${item.model || item.desc || item.author || ''}</p>
                        </div>
                        ${isLink ? '' : `
                        <button onclick="event.stopPropagation(); toggleFavorite('${item.id}')" 
                                class="shrink-0 p-1 rounded-full ${isFav ? 'text-rose-500' : 'text-slate-300 hover:text-slate-400'}">
                            <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-rose-500' : ''}"></i>
                        </button>
                        `}
                    </div>
                </div>
            `;
        }

        // ============== TIKTOK PLAYER ==============
        function openTiktokPlayer(categoryId, index) {
            currentTiktokList = contentData[categoryId];
            currentTiktokIndex = index;
            
            const player = document.getElementById('tiktok-player');
            const slidesContainer = document.getElementById('tiktok-slides');
            
            slidesContainer.innerHTML = currentTiktokList.map((item, idx) => `
                <div class="tiktok-slide" id="slide-${idx}">
                    <video src="${item.video}" playsinline loop ${idx === index ? 'autoplay' : ''} onclick="toggleVideoPlay(this)"></video>
                    
                    <div class="tiktok-info">
                        <h3 class="text-lg font-bold mb-1">${item.name || item.title}</h3>
                        <p class="text-sm opacity-80">${item.model || item.desc || item.author || ''}</p>
                    </div>
                    
                    <div class="tiktok-sidebar">
                        <div class="tiktok-btn ${favorites.includes(item.id) ? 'liked' : ''}" onclick="toggleFavoriteFromPlayer('${item.id}', this)">
                            <i data-lucide="heart" class="w-6 h-6 ${favorites.includes(item.id) ? 'fill-white' : ''}"></i>
                        </div>
                        <div class="tiktok-btn" onclick="openDetailSheet('${item.id}')">
                            <i data-lucide="more-horizontal" class="w-6 h-6"></i>
                        </div>
                        <div class="tiktok-btn" onclick="openWhatsApp()">
                            <i data-lucide="message-circle" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>
            `).join('');
            
            player.classList.add('active');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
            
            // Scroll to start
            setTimeout(() => {
                document.getElementById(`slide-${index}`).scrollIntoView({ behavior: 'auto' });
            }, 10);

            // Snap scroll listener
            slidesContainer.onscroll = debounce(() => {
                const slides = document.querySelectorAll('.tiktok-slide');
                const height = slidesContainer.clientHeight;
                const scroll = slidesContainer.scrollTop;
                const idx = Math.round(scroll / height);
                
                if (idx !== currentTiktokIndex && slides[idx]) {
                    // Pause prev
                    const prevVideo = slides[currentTiktokIndex].querySelector('video');
                    if (prevVideo) prevVideo.pause();
                    
                    // Play new
                    const newVideo = slides[idx].querySelector('video');
                    if (newVideo) newVideo.play();
                    
                    currentTiktokIndex = idx;
                }
            }, 100);
        }

        function scrollTiktok(dir) {
            const container = document.getElementById('tiktok-slides');
            const height = container.clientHeight;
            container.scrollBy({ top: dir * height, behavior: 'smooth' });
        }

        function closeTiktokPlayer() {
            document.getElementById('tiktok-player').classList.remove('active');
            document.body.style.overflow = '';
            document.querySelectorAll('video').forEach(v => v.pause());
        }

        function toggleVideoPlay(video) {
            video.paused ? video.play() : video.pause();
        }

        function toggleFavoriteFromPlayer(id, btn) {
            toggleFavorite(id);
            const isFav = favorites.includes(id);
            btn.classList.toggle('liked', isFav);
            btn.querySelector('i').classList.toggle('fill-white', isFav);
        }

        // ============== UTILS ==============
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ============== DETAIL SHEET ==============
        function openDetailSheet(id) {
            const item = currentTiktokList.find(i => i.id === id);
            if (!item) return;

            const content = document.getElementById('detail-sheet-content');
            
            // Build specs HTML if available
            let specsHtml = '';
            if (item.specs) {
                specsHtml = `
                    <div class="mb-4">
                        <h3 class="font-bold text-xs mb-3 uppercase tracking-widest text-indigo-600">Specifications</h3>
                        <div class="grid grid-cols-2 gap-2">
                            ${Object.entries(item.specs).map(([k, v]) => `
                                <div class="bg-slate-50 dark:bg-slate-800 p-2 rounded-lg">
                                    <p class="text-[9px] text-slate-400 uppercase">${k}</p>
                                    <p class="font-bold text-[10px]">${v}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="mb-4">
                    <p class="text-indigo-600 font-bold text-sm">${item.model || 'Item Detail'}</p>
                    <h2 class="text-xl font-bold">${item.name || item.title}</h2>
                    <p class="text-slate-500 text-sm mt-1">${item.desc || item.author || ''}</p>
                </div>
                
                ${specsHtml}
                
                <div class="flex gap-2">
                    <button onclick="toggleFavorite('${item.id}'); openDetailSheet('${item.id}')" class="flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 ${favorites.includes(item.id) ? 'bg-rose-50 text-rose-500' : 'bg-slate-100 text-slate-600'}">
                        <i data-lucide="heart" class="w-4 h-4 ${favorites.includes(item.id) ? 'fill-rose-500' : ''}"></i>
                        ${favorites.includes(item.id) ? 'Saved' : 'Save'}
                    </button>
                    <button onclick="closeDetailSheet()" class="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white">
                        Close
                    </button>
                </div>
            `;
            
            document.getElementById('detail-sheet-backdrop').classList.add('active');
            document.getElementById('detail-sheet').classList.add('active');
            lucide.createIcons();
        }

        function closeDetailSheet() {
            document.getElementById('detail-sheet-backdrop').classList.remove('active');
            document.getElementById('detail-sheet').classList.remove('active');
        }

        // ============== FAVORITES & SHARED ==============
        function toggleFavorite(id) {
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('fav_list', JSON.stringify(favorites));
            
            // Refresh view
            if (document.getElementById('main-content').innerHTML) {
                renderContent(currentSubId);
            }
            updateUI();
            renderFavoritesList();
        }

        function updateUI() {
            const count = favorites.length;
            document.getElementById('fav-count-badge').textContent = count;
            document.getElementById('fav-count-text').textContent = `(${count})`;
            document.getElementById('share-form').classList.toggle('hidden', count === 0);
        }

        function renderFavoritesList() {
            const container = document.getElementById('favorites-list');
            if (favorites.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-slate-400 space-y-3"><i data-lucide="heart" class="w-12 h-12 mx-auto opacity-10"></i><p>No favorites yet</p></div>`;
            } else {
                // Flatten all data for lookup
                const allItems = [].concat(...Object.values(contentData));
                
                container.innerHTML = favorites.map(id => {
                    const item = allItems.find(x => x.id === id);
                    if (!item) return '';
                    return `<div class="flex items-center gap-4 bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl border border-slate-100 dark:border-slate-700"><img src="${item.thumb}" class="w-12 h-12 rounded-lg object-cover"><div class="flex-1"><h4 class="font-bold text-xs dark:text-white">${item.name || item.title}</h4></div><button onclick="toggleFavorite('${item.id}')" class="text-slate-300 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
                }).join('');
            }
            lucide.createIcons();
        }

        function toggleFavoritesModal() {
            const modal = document.getElementById('favorites-modal');
            const isOpen = !modal.classList.contains('pointer-events-none');
            if (isOpen) {
                document.getElementById('modal-content').classList.add('translate-y-full');
                document.getElementById('modal-backdrop').classList.add('opacity-0');
                setTimeout(() => modal.classList.add('pointer-events-none'), 300);
            } else {
                modal.classList.remove('pointer-events-none');
                document.getElementById('modal-backdrop').classList.remove('opacity-0', 'pointer-events-none');
                renderFavoritesList();
                setTimeout(() => document.getElementById('modal-content').classList.remove('translate-y-full'), 10);
            }
        }

        // ============== ALL CATEGORIES MODAL ==============
        function renderAllCatsModal() {
            const grid = document.getElementById('all-cats-grid');
            grid.innerHTML = navStructure.map(item => `
                <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl cursor-pointer hover:bg-slate-100" onclick="selectCategory('${item.id}'); hideAllCategories()">
                    <span class="font-bold text-sm">${item.label}</span>
                </div>
            `).join('');
        }

        function showAllCategories() {
            const modal = document.getElementById('all-cats-modal');
            modal.classList.remove('pointer-events-none', 'opacity-0');
        }

        function hideAllCategories() {
            const modal = document.getElementById('all-cats-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('pointer-events-none'), 300);
        }

        // ============== CONTACT ==============
        function shareToWhatsApp(skip) {
            if (favorites.length === 0) return alert("Select items first");
            const name = skip ? "" : document.getElementById('cust-name').value;
            // Flatten logic again
            const allItems = [].concat(...Object.values(contentData));
            const list = favorites.map(id => allItems.find(p => p.id === id)?.name || allItems.find(p => p.id === id)?.title).filter(Boolean).join(', ');
            let msg = `Hi, ${name ? "I'm " + name + ". " : ""}I'm interested in: ${list}`;
            window.open(`https://wa.me/8613719343427?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendToEmail() {
            if (favorites.length === 0) return alert("Select items first");
            const email = document.getElementById('cust-email').value;
            if (!email) {
                alert("Please enter your email address");
                return;
            }
            const name = document.getElementById('cust-name').value;
            const allItems = [].concat(...Object.values(contentData));
            const list = favorites.map(id => allItems.find(p => p.id === id)?.name || allItems.find(p => p.id === id)?.title).filter(Boolean).join(', ');
            const subject = "My Interested Products";
            const body = `Hi ${name || ""},\n\nProducts I'm interested in:\n${list}`;
            window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        function openWhatsApp() {
            window.open(`https://wa.me/8613719343427?text=${encodeURIComponent("Hi! Visiting your booth. Send catalog please.")}`, '_blank');
        }

        window.onload = init;
    </script>
</body>
</html>
