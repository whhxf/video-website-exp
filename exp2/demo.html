<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stage Lighting Pro - Video Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #f8fafc;
            --bg-card: white;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .sidebar-item.active {
            background-color: var(--bg-card);
            color: #4f46e5;
            font-weight: 700;
            border-left: 4px solid #4f46e5;
        }

        html { scroll-behavior: smooth; }

        .app-container {
            max-width: 100%;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 100px;
            flex-shrink: 0;
            background-color: var(--bg-primary);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }

        @media (max-width: 767px) {
            .sidebar {
                width: 72px;
            }
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--bg-card);
            padding-bottom: 100px;
        }

        /* Dark mode overrides */
        .dark .bg-white { background-color: #1e293b !important; }
        .dark .bg-slate-50 { background-color: #334155 !important; }
        .dark .bg-slate-100 { background-color: #334155 !important; }
        .dark .text-slate-900 { color: #f1f5f9 !important; }
        .dark .text-slate-700 { color: #e2e8f0 !important; }
        .dark .text-slate-600 { color: #cbd5e1 !important; }
        .dark .text-slate-500 { color: #94a3b8 !important; }
        .dark .border-slate-100 { border-color: #334155 !important; }
        .dark .border-slate-200 { border-color: #475569 !important; }

        /* Video Card Styles */
        .video-card {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .video-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .video-card.landscape { aspect-ratio: 16 / 9; }
        .video-card.portrait { aspect-ratio: 9 / 16; }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Card buttons */
        .card-btn {
            position: absolute;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.2s, background 0.2s;
            z-index: 5;
        }
        .card-btn:hover {
            transform: scale(1.1);
            background: rgba(0,0,0,0.6);
        }
        .card-btn.play-btn { 
            top: 10px; 
            right: 10px; 
        }
        .card-btn.fav-btn { 
            bottom: 10px; 
            right: 10px; 
        }
        
        /* Portrait: fav button above title overlay */
        .video-card.portrait .card-btn.fav-btn {
            bottom: 64px;
        }

        .card-btn.fav-btn.active {
            background: rgba(251, 191, 36, 0.9);
        }

        /* TikTok Style Player */
        .video-player-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .video-player-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .video-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        @media (min-width: 768px) {
            .video-container {
                height: 90vh;
                max-height: 800px;
                aspect-ratio: 9 / 16;
                width: auto;
                max-width: 400px;
            }
        }

        .video-slides {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .video-slides {
                border-radius: 16px;
            }
        }

        .video-slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease-out, opacity 0.4s;
        }

        .video-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .video-slide video {
                border-radius: 16px;
            }
        }

        .video-slide.current { transform: translateY(0); opacity: 1; }
        .video-slide.prev { transform: translateY(-100%); opacity: 0; }
        .video-slide.next { transform: translateY(100%); opacity: 0; }

        /* Side Actions */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        @media (max-width: 767px) {
            .side-actions {
                bottom: 100px;
            }
        }

        .side-action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.2s, background 0.2s;
        }
        .side-action-btn:hover {
            background: rgba(0,0,0,0.6);
            transform: scale(1.1);
        }
        .side-action-btn.active {
            background: rgba(251, 191, 36, 0.9);
        }

        /* Navigation Buttons for PC */
        .nav-buttons {
            position: absolute;
            right: -70px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }
        .nav-btn:hover {
            opacity: 1;
            background: rgba(255,255,255,0.2);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @media (max-width: 767px) {
            .nav-buttons { display: none; }
        }

        /* Swipe Hint */
        .swipe-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 12px;
            opacity: 0.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: bounce 2s infinite;
            z-index: 5;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        @media (min-width: 768px) {
            .swipe-hint { display: none; }
        }

        /* Detail Panel */
        .detail-panel-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 110;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .detail-panel-wrapper.active {
            pointer-events: auto;
            opacity: 1;
        }
        .detail-panel-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }
        .detail-panel {
            position: relative;
            width: 100%;
            max-width: 500px;
            max-height: 70vh;
            background: linear-gradient(to top, rgba(15,23,42,0.98), rgba(30,41,59,0.95));
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            overflow-y: auto;
            z-index: 1;
        }
        .detail-panel-wrapper.active .detail-panel {
            transform: translateY(0);
        }

        .detail-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background 0.2s;
        }
        .detail-close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Close Button for Player */
        .close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: rgba(0,0,0,0.6);
        }

        @media (max-width: 767px) {
            .close-btn {
                top: env(safe-area-inset-top, 16px);
            }
        }

        /* Video Info Overlay */
        .video-info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 70px;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            z-index: 5;
        }

        @media (max-width: 767px) {
            .video-info-overlay {
                padding-bottom: env(safe-area-inset-bottom, 20px);
            }
        }

        /* Grid Layouts */
        .video-grid-landscape {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .video-grid-landscape {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        .video-grid-portrait {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
        }

        .video-grid-portrait .video-card {
            width: calc(66.67vw - 60px);
            max-width: 200px;
            scroll-snap-align: start;
        }

        @media (min-width: 768px) {
            .video-grid-portrait {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                overflow-x: visible;
            }
            .video-grid-portrait .video-card {
                width: auto;
                max-width: none;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        /* Section styling */
        .category-section {
            scroll-margin-top: 20px;
            padding-top: 24px;
            padding-bottom: 24px;
        }

        /* Top Navigation - Primary Pages */
        .top-nav {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0 12px;
            height: 48px;
            overflow-x: auto;
            align-items: center;
            gap: 4px;
        }
        .top-nav-item {
            padding: 10px 16px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-nav-item:hover {
            background: var(--bg-primary);
            color: var(--text-main);
        }
        .top-nav-item.active {
            background: #4f46e5;
            color: white;
        }

        /* Search Bar Expandable */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 40px;
            height: 40px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-container.expanded {
            width: 200px;
        }
        @media (min-width: 640px) {
            .search-container.expanded {
                width: 260px;
            }
        }
        .search-input-wrapper {
            position: absolute;
            right: 0;
            width: 100%;
            height: 40px;
            background: var(--bg-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .search-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 0 40px 0 16px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .search-container.expanded .search-input {
            opacity: 1;
        }
        .search-btn {
            position: absolute;
            right: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            z-index: 2;
        }
        .search-container.expanded .search-btn {
            color: #4f46e5;
        }

        /* Bottom Floating Buttons */
        .bottom-float {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .float-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .float-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }
        .float-btn:active {
            transform: scale(0.98);
        }

        .float-btn-fav {
            background: white;
            color: #0f172a;
            border: 1px solid #e2e8f0;
        }
        .dark .float-btn-fav {
            background: #1e293b;
            color: #f1f5f9;
            border-color: #334155;
        }

        .float-btn-whatsapp {
            background: #22c55e;
            color: white;
            padding: 12px 16px;
        }

        .fav-count-badge {
            background: #f59e0b;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 24px;
            text-align: center;
        }

        /* Favorites Expanded Panel */
        .fav-expanded {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .fav-expanded.active {
            pointer-events: auto;
            opacity: 1;
        }
        .fav-expanded-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }
        .fav-expanded-content {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: calc(100% - 32px);
            max-width: 500px;
            max-height: 85vh;
            background: white;
            border-radius: 24px 24px 0 0;
            transition: transform 0.3s ease-out;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .dark .fav-expanded-content {
            background: #1e293b;
        }
        .fav-expanded.active .fav-expanded-content {
            transform: translateX(-50%) translateY(0);
        }

        /* Language dropdown */
        .lang-dropdown {
            position: relative;
        }
        .lang-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s;
            z-index: 100;
        }
        .dark .lang-menu {
            background: #1e293b;
        }
        .lang-dropdown.open .lang-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .lang-option {
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-option:hover {
            background: var(--bg-primary);
        }
        .lang-option.active {
            color: #4f46e5;
            font-weight: 600;
        }
    </style>

</head>
<body class="text-slate-900 transition-colors duration-300">

    <div class="app-container">
        <!-- Header -->
        <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 px-4 h-16 flex justify-between items-center transition-colors">
            <div class="flex items-center gap-3 min-w-0">
                <div class="flex items-center gap-2 shrink-0">
                    <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-200">SL</div>
                    <div class="hidden lg:block">
                        <h1 class="font-bold text-base leading-none">STAGE LIGHTING PRO</h1>
                        <p class="text-[10px] text-slate-400 mt-0.5 uppercase tracking-tighter">Video Gallery</p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-2 shrink-0 ml-2">
                <!-- Expandable Search (Now next to language) -->
                <div class="search-container" id="search-container">
                    <div class="search-input-wrapper">
                        <input type="text" id="search-input" placeholder="Search..." class="search-input dark:text-slate-200">
                    </div>
                    <button onclick="toggleSearch()" class="search-btn">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Language Switcher -->
                <div class="lang-dropdown" id="lang-dropdown">
                    <button onclick="toggleLangMenu()" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors flex items-center gap-1">
                        <i data-lucide="globe" class="w-4 h-4"></i>
                        <span class="text-xs font-medium hidden sm:inline" id="current-lang">EN</span>
                    </button>
                    <div class="lang-menu">
                        <div class="lang-option active" onclick="setLanguage('en')">
                            <span>🇺🇸</span> English
                        </div>
                        <div class="lang-option" onclick="setLanguage('zh')">
                            <span>🇨🇳</span> 中文
                        </div>
                        <div class="lang-option" onclick="setLanguage('es')">
                            <span>🇪🇸</span> Español
                        </div>
                    </div>
                </div>
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors shrink-0">
                    <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                    <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                </button>
            </div>
        </nav>

        <!-- Top Navigation - Primary Pages -->
        <div class="top-nav no-scrollbar" id="top-nav">
            <button onclick="switchPage('home')" class="top-nav-item active" data-page="home">
                <span>Home</span>
            </button>
            <button onclick="switchPage('products')" class="top-nav-item" data-page="products">
                <span>Products</span>
            </button>
            <button onclick="switchPage('about')" class="top-nav-item" data-page="about">
                <span>About Us</span>
            </button>
            <button onclick="switchPage('contact')" class="top-nav-item" data-page="contact">
                <span>Contact</span>
            </button>
        </div>

        <!-- App Layout -->
        <div class="app-layout">
            <!-- Sidebar Navigation -->
            <aside class="sidebar no-scrollbar" id="sidebar">
                <nav class="flex flex-col" id="sidebar-nav">
                    <!-- Rendered by JS -->
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="content-area no-scrollbar px-4" id="main-content">
                <!-- Rendered by JS -->
            </main>
        </div>
    </div>

    <!-- Bottom Floating Buttons -->
    <div class="bottom-float" id="bottom-float">
        <button onclick="openFavExpanded()" class="float-btn float-btn-fav">
            <i data-lucide="star" class="w-5 h-5 text-amber-500"></i>
            <span id="fav-btn-text">Favorites</span>
            <span class="fav-count-badge" id="fav-count-badge">0</span>
        </button>

    <script>

                videos: [
                    { id: "v10", title: "350W Beam", subtitle: "BEAM-350", orientation: "landscape", cover: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&q=80&w=400", video: VIDEO_URL, description: "Super sharp 8 degree beam.", transcript: "OSRAM source, 16 channels." }
                ]
            },
            "static-lights": {

                name: "Static Lights",
                description: "PAR and Wash lights.",
                videos: [
                    { id: "v12", title: "LED PAR 54", subtitle: "PAR-54", orientation: "landscape", cover: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&q=80&w=400", video: VIDEO_URL, description: "RGBW mixing, 25 degree.", transcript: "Die-cast aluminum shell." }
                ]

            "accessories": {
                id: "accessories",
                name: "Accessories",
                description: "Controllers and cases.",
                videos: [
                    { id: "v14", title: "Lighting Console", subtitle: "PRO-CONSOLE", orientation: "landscape", cover: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&q=80&w=400", video: VIDEO_URL, description: "8 DMX Universes.", transcript: "Touchscreen interface." }
                ]
            },
            "about-company": {
                id: "about-company",
                name: "Company Profile",
                description: "Our mission and values.",
                videos: [
                    { id: "v15", title: "About Us", subtitle: "Who We Are", orientation: "landscape", cover: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&q=80&w=600", video: VIDEO_URL, description: "Leading manufacturer since 2009.", transcript: "We provide high-end stage solutions." }
                ]
            },
            "contact-info": {
                id: "contact-info",
                name: "Get in Touch",
                description: "Contact our sales team.",
                videos: [
                    { id: "v16", title: "Our Showroom", subtitle: "Visit Us", orientation: "landscape", cover: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=600", video: VIDEO_URL, description: "Live demos in Guangzhou.", transcript: "Welcome to our showroom." }
                ]
            }
        };

        let favorites = JSON.parse(localStorage.getItem('video_favorites') || '[]');
        let currentVideoList = [];
        let currentVideoIndex = 0;
        let currentPage = 'home';
        let touchStartY = 0;
        let touchEndY = 0;
        let swipeHintShown = false;

        function init() {
            switchPage('home');
            updateFavCount();
            setupSwipeGestures();
            lucide.createIcons();
            initTheme();
        }

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        }

        function toggleLangMenu() {
            document.getElementById('lang-dropdown').classList.toggle('open');
        }

        function setLanguage(lang) {
            localStorage.setItem('lang', lang);
            document.getElementById('current-lang').textContent = lang.toUpperCase();
            document.getElementById('lang-dropdown').classList.remove('open');
            document.querySelectorAll('.lang-option').forEach(el => el.classList.remove('active'));
            if (event) event.target.closest('.lang-option').classList.add('active');
        }

        function toggleSearch() {
            const container = document.getElementById('search-container');
            const input = document.getElementById('search-input');
            const isExpanded = container.classList.toggle('expanded');
            if (isExpanded) {
                setTimeout(() => input.focus(), 100);
            } else {
                input.value = '';
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.lang-dropdown')) {
                document.getElementById('lang-dropdown').classList.remove('open');
            }
            const searchContainer = document.getElementById('search-container');
            if (!searchContainer.contains(e.target) && searchContainer.classList.contains('expanded')) {
                toggleSearch();
            }
        });

        function switchPage(pageId) {
            currentPage = pageId;
            document.querySelectorAll('.top-nav-item').forEach(item => {
                item.classList.toggle('active', item.getAttribute('data-page') === pageId);
            });
            renderSidebar(pageId);
            renderContent(pageId);
            lucide.createIcons();
        }

        function renderSidebar(pageId) {
            const page = pages[pageId];
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = page.categories.map((catId, idx) => {
                const cat = videoCategories[catId];
                return `
                    <a href="#${catId}" onclick="event.preventDefault(); scrollToCategory('${catId}')" class="sidebar-item ${idx === 0 ? 'active' : ''} flex items-center py-4 px-3 text-left transition-all border-l-4 border-transparent hover:bg-slate-50 dark:hover:bg-slate-800" data-category="${catId}">
                        <span class="text-[11px] font-medium leading-tight">${cat.name}</span>
                    </a>
                `;
            }).join('');
        }

        function scrollToCategory(categoryId) {
            const section = document.getElementById(categoryId);
            const content = document.getElementById('main-content');
            if (section && content) {
                const offsetTop = section.offsetTop - content.offsetTop;
                content.scrollTo({ top: offsetTop - 20, behavior: 'smooth' });
                updateActiveNav(categoryId);
            }
        }

        function updateActiveNav(categoryId) {
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.toggle('active', item.getAttribute('data-category') === categoryId);
            });
        }

        function renderContent(pageId) {
            const page = pages[pageId];
            const main = document.getElementById('main-content');
            let html = '';

            page.categories.forEach(catId => {
                const category = videoCategories[catId];
                const videos = category.videos;
                const hasLandscape = videos.some(v => v.orientation === 'landscape');
                const hasPortrait = videos.some(v => v.orientation === 'portrait');

                html += `
                    <section id="${catId}" class="category-section">
                        <div class="mb-4">
                            <div class="flex items-center justify-between mb-1">
                                <h2 class="text-lg font-bold">${category.name}</h2>
                                <span class="text-xs text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full">${videos.length} videos</span>
                            </div>
                            <p class="text-xs text-slate-500">${category.description}</p>
                        </div>
                `;

                if (hasLandscape) {
                    const landscapeVideos = videos.filter(v => v.orientation === 'landscape');
                    html += `<div class="video-grid-landscape ${hasPortrait ? 'mb-4' : ''}">${landscapeVideos.map(v => renderVideoCard(v, catId)).join('')}</div>`;
                }

                if (hasPortrait) {
                    const portraitVideos = videos.filter(v => v.orientation === 'portrait');
                    html += `<div class="video-grid-portrait no-scrollbar">${portraitVideos.map(v => renderVideoCard(v, catId)).join('')}</div>`;
                }

                html += `</section>`;
            });

            main.innerHTML = html;
            main.scrollTop = 0;
            setupScrollSpy();
            lucide.createIcons();
        }

        function setupScrollSpy() {
            const content = document.getElementById('main-content');
            const sections = content.querySelectorAll('.category-section');
            content.onscroll = () => {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop - content.offsetTop;
                    if (content.scrollTop >= sectionTop - 100) current = section.getAttribute('id');
                });
                if (current) updateActiveNav(current);
            };
        }

        function renderVideoCard(video, categoryId) {
            const isLandscape = video.orientation === 'landscape';
            const isFavorite = favorites.includes(video.id);
            const favIcon = isFavorite ? 'fill-white' : '';
            const favActive = isFavorite ? 'active' : '';
            
            const commonBtns = `
                <button onclick="event.stopPropagation();" class="card-btn play-btn">
                    <i data-lucide="play" class="w-4 h-4 text-white fill-white"></i>
                </button>
                <button onclick="event.stopPropagation(); toggleCardFavorite('${video.id}')" class="card-btn fav-btn ${favActive}">
                    <i data-lucide="star" class="w-4 h-4 ${favIcon}"></i>
                </button>
            `;

            if (isLandscape) {
                return `
                    <div class="animate-fade-in">
                        <div class="video-card landscape" onclick="openPlayer('${categoryId}', '${video.id}')">
                            <img src="${video.cover}" alt="${video.title}">
                            ${commonBtns}
                        </div>
                        <div class="mt-2">
                            <h4 class="font-bold text-sm dark:text-white truncate">${video.title}</h4>
                            <p class="text-xs text-slate-500 truncate">${video.subtitle}</p>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="video-card portrait animate-fade-in" onclick="openPlayer('${categoryId}', '${video.id}')">
                        <img src="${video.cover}" alt="${video.title}">
                        ${commonBtns}
                        <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/80 to-transparent">
                            <h4 class="font-bold text-xs text-white truncate">${video.title}</h4>
                            <p class="text-[10px] text-white/70 truncate">${video.subtitle}</p>
                        </div>
                    </div>
                `;
            }
        }

        function toggleCardFavorite(videoId) {
            const idx = favorites.indexOf(videoId);
            if (idx > -1) favorites.splice(idx, 1); else favorites.push(videoId);
            localStorage.setItem('video_favorites', JSON.stringify(favorites));
            updateFavCount();
            renderContent(currentPage);
        }

        function openPlayer(categoryId, videoId) {
            const category = videoCategories[categoryId];
            currentVideoList = category.videos;
            currentVideoIndex = currentVideoList.findIndex(v => v.id === videoId);
            renderPlayerSlides();
            updatePlayerUI();
            document.getElementById('video-player').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function renderPlayerSlides() {
            const container = document.getElementById('video-slides');
            container.innerHTML = currentVideoList.map((video, idx) => {
                let posClass = idx === currentVideoIndex ? 'current' : (idx < currentVideoIndex ? 'prev' : 'next');
                return `
                    <div class="video-slide ${posClass}" data-index="${idx}">
                        <video src="${video.video}" playsinline loop ${idx === currentVideoIndex ? 'autoplay' : ''} muted></video>
                    </div>
                `;
            }).join('');
        }

        function updatePlayerUI() {
            const video = currentVideoList[currentVideoIndex];
            document.getElementById('video-title').textContent = video.title;
            document.getElementById('video-subtitle').textContent = video.subtitle;
            document.getElementById('fav-btn').classList.toggle('active', favorites.includes(video.id));
            document.getElementById('detail-title').textContent = video.title;
            document.getElementById('detail-category').textContent = video.subtitle;
            document.getElementById('detail-description').textContent = video.description;
            document.getElementById('detail-transcript').textContent = video.transcript;
            updateDetailFavBtn();
            document.getElementById('nav-up').disabled = currentVideoIndex === 0;
            document.getElementById('nav-down').disabled = currentVideoIndex === currentVideoList.length - 1;
            document.querySelectorAll('.video-slide').forEach((slide, idx) => {
                slide.classList.remove('current', 'prev', 'next');
                const vid = slide.querySelector('video');
                if (idx === currentVideoIndex) { slide.classList.add('current'); vid.play(); }
                else if (idx < currentVideoIndex) { slide.classList.add('prev'); vid.pause(); vid.currentTime = 0; }
                else { slide.classList.add('next'); vid.pause(); vid.currentTime = 0; }
            });
            lucide.createIcons();
        }

        function updateDetailFavBtn() {
            const video = currentVideoList[currentVideoIndex];
            const isFavorite = favorites.includes(video.id);
            const btn = document.getElementById('detail-fav-btn-wrap');
            const text = document.getElementById('detail-fav-text');
            if (isFavorite) {
                btn.classList.replace('text-amber-500', 'text-white');
                btn.classList.add('bg-amber-500');
                text.textContent = 'Remove from Favorites';
            } else {
                btn.classList.replace('text-white', 'text-amber-500');
                btn.classList.remove('bg-amber-500');
                text.textContent = 'Add to Favorites';
            }
            lucide.createIcons();
        }

        function navigateVideo(direction) {
            const newIndex = currentVideoIndex + direction;
            if (newIndex >= 0 && newIndex < currentVideoList.length) {
                currentVideoIndex = newIndex;
                updatePlayerUI();
            }
        }

        function setupSwipeGestures() {
            const container = document.getElementById('video-container');
            container.addEventListener('touchstart', (e) => touchStartY = e.changedTouches[0].screenY, { passive: true });
            container.addEventListener('touchend', (e) => {
                touchEndY = e.changedTouches[0].screenY;
                const diff = touchStartY - touchEndY;
                if (Math.abs(diff) > 50) navigateVideo(diff > 0 ? 1 : -1);
            }, { passive: true });
        }

        function closePlayer() {
            document.getElementById('video-player').classList.remove('active');
            document.getElementById('detail-panel-wrapper').classList.remove('active');
            document.body.style.overflow = '';
            document.querySelectorAll('.video-slide video').forEach(v => { v.pause(); v.currentTime = 0; });
        }

        function toggleDetailPanel() { document.getElementById('detail-panel-wrapper').classList.toggle('active'); }

        function toggleVideoFavorite() {
            const video = currentVideoList[currentVideoIndex];
            const idx = favorites.indexOf(video.id);
            if (idx > -1) favorites.splice(idx, 1); else favorites.push(video.id);
            localStorage.setItem('video_favorites', JSON.stringify(favorites));
            updatePlayerUI();
            updateFavCount();
            renderContent(currentPage);
        }

        function updateFavCount() {
            const count = favorites.length;
            document.getElementById('fav-count-badge').textContent = count;
            document.getElementById('fav-count-text').textContent = `(${count})`;
        }

        function getFavoriteVideos() {
            const favVideos = [];
            Object.values(videoCategories).forEach(cat => cat.videos.forEach(v => { if (favorites.includes(v.id)) favVideos.push({ ...v, categoryId: cat.id, categoryName: cat.name }); }));
            return favVideos;
        }

        function removeFavorite(videoId) {
            const idx = favorites.indexOf(videoId);
            if (idx > -1) {
                favorites.splice(idx, 1);
                localStorage.setItem('video_favorites', JSON.stringify(favorites));
                updateFavCount();
                renderContent(currentPage);
                renderFavExpandedList();
            }
        }

        function openFavExpanded() { renderFavExpandedList(); document.getElementById('fav-expanded').classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeFavExpanded() { document.getElementById('fav-expanded').classList.remove('active'); document.body.style.overflow = ''; }

        function renderFavExpandedList() {
            const container = document.getElementById('fav-expanded-list');
            const favVideos = getFavoriteVideos();
            if (favVideos.length === 0) {
                container.innerHTML = `<div class="py-8 text-center text-slate-400 space-y-3"><i data-lucide="star" class="w-12 h-12 mx-auto opacity-20"></i><p>No favorites yet</p></div>`;
            } else {
                container.innerHTML = favVideos.map(v => `
                    <div class="flex items-center gap-3 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl cursor-pointer" onclick="closeFavExpanded(); openPlayer('${v.categoryId}', '${v.id}')">
                        <div class="w-14 h-14 rounded-lg overflow-hidden flex-shrink-0"><img src="${v.cover}" class="w-full h-full object-cover"></div>
                        <div class="flex-1 min-w-0"><h4 class="font-bold text-sm dark:text-white truncate">${v.title}</h4><p class="text-[11px] text-slate-500 truncate">${v.categoryName}</p></div>
                        <button onclick="event.stopPropagation(); removeFavorite('${v.id}')" class="text-slate-400 hover:text-red-500 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        function sendEmail() {
            const user = { name: document.getElementById('user-name').value, email: document.getElementById('user-email').value };
            if (!user.email) return alert('Please enter your email address');
            const url = window.location.origin + window.location.pathname + '?ids=' + favorites.join(',');
            const body = `Hello, I'm ${user.name || 'a customer'}. Interested in: ${getFavoriteVideos().map(v => v.title).join(', ')}. List: ${url}`;
            window.location.href = `mailto:sales@stagelightingpro.com?subject=Inquiry&body=${encodeURIComponent(body)}`;
        }

        function sendWhatsApp() {
            const user = { name: document.getElementById('user-name').value };
            const url = window.location.origin + window.location.pathname + '?ids=' + favorites.join(',');
            const msg = `Hello! I'm ${user.name || 'a customer'}. Interested in these: ${url}`;
            window.open(`https://wa.me/8613719343427?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function bottomWhatsApp() {
            const url = window.location.origin + window.location.pathname + '?ids=' + favorites.join(',');
            const msg = `Hello! Interested in these: ${url}`;
            window.open(`https://wa.me/8613719343427?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function playerWhatsApp() {
            const video = currentVideoList[currentVideoIndex];
            window.open(`https://wa.me/8613719343427?text=${encodeURIComponent('Interested in: ' + video.title)}`, '_blank');
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('video-player').classList.contains('active')) return;
            if (e.key === 'ArrowUp' || e.key === 'k') navigateVideo(-1);
            else if (e.key === 'ArrowDown' || e.key === 'j') navigateVideo(1);
            else if (e.key === 'Escape') { if (document.getElementById('detail-panel-wrapper').classList.contains('active')) toggleDetailPanel(); else closePlayer(); }
        });

        window.onload = init;
    </script>
</body>
</html>
