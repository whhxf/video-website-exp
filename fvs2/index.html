<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程视频验厂系统 - Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="main-header">
            <div class="logo">
                <span class="logo-icon">📡</span>
                <h1>远程视频验厂系统</h1>
            </div>
            <div class="status-bar">
                <span id="camera-count-tip">共 6 个镜头可查看</span>
                <span class="system-time" id="system-time">2026-01-17 10:00:00</span>
            </div>
        </header>

        <main class="main-content">
            <!-- 左侧：视频播放与云台控制 -->
            <section class="left-panel">
                <div class="video-section">
                    <div class="video-wrapper">
                        <video id="main-video" autoplay muted loop playsinline>
                            <!-- 默认视频源 -->
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-factory-robotic-arm-manufacturing-4034-large.mp4" type="video/mp4">
                        </video>
                        <!-- 视频水印遮罩 -->
                        <div class="video-overlay">
                            <div class="overlay-top">
                                <span class="cam-id" id="overlay-cam-name">#1 生产车间-东</span>
                                <span class="cam-time" id="overlay-cam-time">2026-01-17 10:32:15</span>
                            </div>
                            <div class="overlay-bottom">
                                <span class="rec-dot">● REC</span>
                            </div>
                        </div>
                        <!-- 加载动画 -->
                        <div class="video-loader" id="video-loader">
                            <div class="spinner"></div>
                            <span>正在连接镜头...</span>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <div class="ptz-panel">
                        <h3>云台控制 (PTZ)</h3>
                        <div class="ptz-controls">
                            <button class="ptz-btn up" data-dir="up" title="向上">▲</button>
                            <div class="ptz-mid">
                                <button class="ptz-btn left" data-dir="left" title="向左">◄</button>
                                <div class="ptz-center">●</div>
                                <button class="ptz-btn right" data-dir="right" title="向右">►</button>
                            </div>
                            <button class="ptz-btn down" data-dir="down" title="向下">▼</button>
                        </div>
                    </div>
                    <div class="zoom-panel">
                        <button class="action-btn">变倍 +</button>
                        <button class="action-btn">变倍 -</button>
                        <button class="action-btn" id="fullscreen-btn">全屏显示</button>
                    </div>
                </div>
            </section>

            <!-- 右侧：平面图与信息 -->
            <aside class="right-panel">
                <div class="floor-plan-section">
                    <h3>厂房平面图</h3>
                    <div class="floor-plan-container" id="floor-plan">
                        <!-- SVG 平面图 -->
                        <svg viewBox="0 0 400 300" class="floor-plan-svg">
                            <rect x="10" y="10" width="380" height="280" fill="none" stroke="#444" stroke-width="2"/>
                            <!-- 车间区域 -->
                            <rect x="20" y="20" width="150" height="120" fill="rgba(0, 212, 255, 0.05)" stroke="#333"/>
                            <text x="30" y="40" fill="#666" font-size="12">生产车间 A区</text>
                            
                            <rect x="180" y="20" width="200" height="120" fill="rgba(0, 212, 255, 0.05)" stroke="#333"/>
                            <text x="190" y="40" fill="#666" font-size="12">生产车间 B区</text>

                            <rect x="20" y="150" width="100" height="130" fill="rgba(0, 212, 255, 0.05)" stroke="#333"/>
                            <text x="30" y="170" fill="#666" font-size="12">成品仓库</text>

                            <rect x="130" y="150" width="250" height="130" fill="rgba(0, 212, 255, 0.05)" stroke="#333"/>
                            <text x="140" y="170" fill="#666" font-size="12">质检与包装区</text>

                            <!-- 摄像头点位将在 JS 中动态生成 -->
                            <g id="camera-markers"></g>
                        </svg>
                    </div>
                </div>

                <div class="info-section">
                    <div class="location-info">
                        <h3 id="info-title">生产车间 A区</h3>
                        <p id="info-desc">主要生产车间，拥有20条自动化产线，日产能达50000件。配备先进的德国进口设备。</p>
                    </div>
                    <div class="status-tags">
                        <span class="tag">4K超清</span>
                        <span class="tag">红外夜视</span>
                        <span class="tag online">在线</span>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 底部：镜头列表 -->
        <footer class="bottom-panel">
            <div class="camera-list" id="camera-list">
                <!-- 镜头卡片将通过 JS 动态生成 -->
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
