<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 展示导航</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl w-full">
        <!-- Main Title -->
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">
                请选择查看 Demo 效果
            </h1>
            <p class="text-slate-500 text-lg">点击下方卡片进入对应的项目演示页面</p>
        </div>

        <!-- Grid Container -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Card 1: exp -->
            <a href="exp/index.html" class="group">
                <div class="bg-white rounded-[32px] p-8 h-full border border-slate-200 card-hover flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300">
                        <i data-lucide="layout" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-3">视频独立站展会版</h2>
                    <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                        适配移动端与 PC 端，具备暗色模式切换、产品视频轮播及高效的展会询盘收集系统。
                    </p>
                    <div class="mt-auto flex items-center gap-2 text-indigo-600 font-bold uppercase tracking-wider text-sm">
                        进入演示
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            </a>

            <!-- Card 2: fvs -->
            <a href="fvs/index.html" class="group">
                <div class="bg-white rounded-[32px] p-8 h-full border border-slate-200 card-hover flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 mb-6 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-300">
                        <i data-lucide="factory" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-3">视频验厂互动</h2>
                    <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                        通过交互式视频体验工厂实地考察，深度展示生产实力与质量控制流程。
                    </p>
                    <div class="mt-auto flex items-center gap-2 text-emerald-600 font-bold uppercase tracking-wider text-sm">
                        进入演示
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            </a>

        </div>

        <!-- Footer Info -->
        <div class="mt-16 text-center text-slate-400 text-xs uppercase tracking-[0.2em]">
            &copy; 2026 Kingsway Video
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
